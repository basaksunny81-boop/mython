<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mains Descriptive Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between font-sans text-slate-800">

    <div class="max-w-md mx-auto w-full p-6 mt-16 bg-white rounded-2xl shadow-xl border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Mains Descriptive Test</h1>
            <p class="text-sm text-slate-500 mt-1">Student Login & Registration Portal</p>
        </div>

        <div id="auth-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email Address</label>
                <input type="email" id="email" placeholder="student@example.com" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                <input type="password" id="password" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>
            
            <div class="flex gap-3 pt-2">
                <button onclick="handleSignUp()" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition-colors shadow-sm">Sign Up</button>
                <button onclick="handleLogin()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition-colors shadow-sm">Log In</button>
            </div>
            <p id="message" class="text-center text-xs mt-4 font-medium"></p>
        </div>

        <div id="dashboard" class="hidden text-center space-y-4">
            <div class="bg-indigo-50 text-indigo-700 p-4 rounded-xl text-sm font-medium">
                Welcome back! You are logged in securely. (Single-device active)
            </div>
            <button onclick="handleLogout()" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium py-2 px-4 rounded-lg text-sm transition-colors">Log Out</button>
        </div>
    </div>

    <footer class="text-center py-6 text-xs text-slate-400">
        Powered by Supabase & Vercel
    </footer>

    <script>
        const supabaseUrl = 'https://etrmoqrmfcfsknqhljqo.supabase.co';
        const supabaseKey = 'sb_publishable_xOoV1cKpatBdsrydC0P8NQ_Q7xp9xfL';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function checkUser() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-form').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                initSessionGuard(session.user.id);
            }
        }
        checkUser();

        async function initSessionGuard(userId) {
            const localSessionToken = localStorage.getItem('current_session_token');

            // Verify against database profile
            const { data, error } = await _supabase
                .from('profiles')
                .select('session_token')
                .eq('id', userId)
                .single();

            if (data && data.session_token !== localSessionToken) {
                alert('You have been logged out because this account was accessed from another device.');
                await _supabase.auth.signOut();
                localStorage.removeItem('current_session_token');
                location.reload();
                return;
            }

            // Listen for live overrides from other devices
            _supabase
                .channel('public:profiles')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles', filter: `id=eq.${userId}` }, payload => {
                    if (payload.new.session_token !== localStorage.getItem('current_session_token')) {
                        alert('Logged out: Your account was signed into another device.');
                        _supabase.auth.signOut().then(() => {
                            localStorage.removeItem('current_session_token');
                            location.reload();
                        });
                    }
                })
                .subscribe();
        }

        async function handleSignUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');
            
            const { data, error } = await _supabase.auth.signUp({ email, password });
            if (error) {
                msg.className = "text-center text-xs mt-4 font-medium text-rose-600";
                msg.innerText = error.message;
            } else {
                msg.className = "text-center text-xs mt-4 font-medium text-emerald-600";
                msg.innerText = "Check your email for confirmation link!";
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');
            
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) {
                msg.className = "text-center text-xs mt-4 font-medium text-rose-600";
                msg.innerText = error.message;
            } else {
                // Generate unique device session token
                const newSessionToken = crypto.randomUUID();
                localStorage.setItem('current_session_token', newSessionToken);

                // Upsert session token into profiles table
                await _supabase.from('profiles').upsert({
                    id: data.user.id,
                    session_token: newSessionToken,
                    updated_at: new Date()
                });

                location.reload();
            }
        }

        async function handleLogout() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                await _supabase.from('profiles').update({ session_token: null }).eq('id', session.user.id);
            }
            await _supabase.auth.signOut();
            localStorage.removeItem('current_session_token');
            location.reload();
        }
    </script>
</body>
</html>
